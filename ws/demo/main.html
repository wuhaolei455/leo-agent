<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 客户端 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .status {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
        }

        .status.connecting {
            background: #fef3c7;
            color: #92400e;
        }

        .status.connected {
            background: #d1fae5;
            color: #065f46;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.primary {
            background: #667eea;
            color: white;
        }

        button.primary:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #e5e7eb;
            color: #374151;
        }

        button.secondary:hover {
            background: #d1d5db;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages {
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .messages h3 {
            font-size: 16px;
            color: #374151;
            margin-bottom: 10px;
        }

        .message {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.sent {
            background: #dbeafe;
            color: #1e40af;
            margin-left: 20px;
        }

        .message.received {
            background: #dcfce7;
            color: #166534;
            margin-right: 20px;
        }

        .message.system {
            background: #f3f4f6;
            color: #6b7280;
            text-align: center;
            font-style: italic;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .auto-send {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 12px;
            background: #f0f9ff;
            border-radius: 8px;
        }

        .auto-send label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
        }

        .auto-send input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 WebSocket 客户端</h1>
        
        <div id="status" class="status connecting">
            正在连接服务器...
        </div>

        <div class="controls">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="输入消息..." 
                disabled
            >
            <button class="primary" id="sendBtn" disabled>发送</button>
            <button class="secondary" id="clearBtn">清空</button>
        </div>

        <div class="auto-send">
            <label>
                <input type="checkbox" id="autoSendCheckbox">
                自动发送消息（每2秒）
            </label>
        </div>

        <div class="messages">
            <h3>📝 消息记录</h3>
            <div id="messageList"></div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageList = document.getElementById('messageList');
        const autoSendCheckbox = document.getElementById('autoSendCheckbox');
        
        let ws = null;
        let autoSendInterval = null;

        // 添加消息到列表
        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const typeText = type === 'sent' ? '📤 发送' : type === 'received' ? '📥 接收' : '📌 系统';
            
            messageDiv.innerHTML = `
                <div>${typeText}: ${content}</div>
                <div class="timestamp">${timestamp}</div>
            `;
            
            messageList.appendChild(messageDiv);
            messageList.scrollTop = messageList.scrollHeight;
        }

        // 更新状态
        function updateStatus(status, text) {
            statusEl.className = `status ${status}`;
            statusEl.textContent = text;
        }

        // 连接 WebSocket
        function connect() {
            ws = new WebSocket('ws://localhost:3200');

            ws.onopen = function() {
                console.log('[客户端] WebSocket 连接已经建立。');
                updateStatus('connected', '✅ 已连接到服务器');
                addMessage('system', '连接成功');
                
                messageInput.disabled = false;
                sendBtn.disabled = false;
                
                // 首次连接发送问候消息
                ws.send('Hello, server!');
                addMessage('sent', 'Hello, server!');
            };

            ws.onmessage = function(event) {
                console.log('[客户端] 收到服务器消息：', event.data);
                addMessage('received', event.data);
            };

            ws.onerror = function(event) {
                console.error('[客户端] WebSocket 连接出现错误：', event);
                updateStatus('disconnected', '❌ 连接错误');
                addMessage('system', '连接出现错误');
            };

            ws.onclose = function() {
                console.log('[客户端] WebSocket 连接已经关闭。');
                updateStatus('disconnected', '⭕ 连接已断开');
                addMessage('system', '连接已关闭');
                
                messageInput.disabled = true;
                sendBtn.disabled = true;
                
                // 停止自动发送
                if (autoSendInterval) {
                    clearInterval(autoSendInterval);
                    autoSendInterval = null;
                    autoSendCheckbox.checked = false;
                }
                
                // 5秒后尝试重连
                setTimeout(() => {
                    addMessage('system', '尝试重新连接...');
                    connect();
                }, 5000);
            };
        }

        // 发送消息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                addMessage('sent', message);
                messageInput.value = '';
            }
        }

        // 事件监听
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        clearBtn.addEventListener('click', () => {
            messageList.innerHTML = '';
        });

        autoSendCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                // 开启自动发送
                autoSendInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const message = 'Hello, server!';
                        ws.send(message);
                        addMessage('sent', message + ' (自动)');
                        console.log('[客户端] 自动发送消息：', message);
                    }
                }, 2000);
                addMessage('system', '已开启自动发送');
            } else {
                // 关闭自动发送
                if (autoSendInterval) {
                    clearInterval(autoSendInterval);
                    autoSendInterval = null;
                    addMessage('system', '已关闭自动发送');
                }
            }
        });

        // 页面加载时连接
        connect();

        // 页面关闭时清理
        window.addEventListener('beforeunload', () => {
            if (autoSendInterval) {
                clearInterval(autoSendInterval);
            }
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
